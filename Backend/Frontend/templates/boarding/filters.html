<section class="bg-light py-4 border-bottom">

    <div class="container">

        <div class="row g-3">

            <div class="col-lg-3">
                <input
                    type="text"
                    class="form-control"
                    placeholder="Search boarding house"
                    aria-label="Search boarding house">
            </div>

            <div class="col-lg-2">
                <select class="form-select" aria-label="Select location">
                    <option selected>Location</option>
                    <option>Poblacion</option>
                    <option>Zamora</option>
                    <option>Bugang</option>
                </select>
            </div>

            <div class="col-lg-2">
                <select class="form-select" aria-label="Select price range">
                    <option selected>Price</option>
                    <option>Below ₱1,500</option>
                    <option>₱1,500 - ₱2,500</option>
                    <option>Above ₱2,500</option>
                </select>
            </div>

            <div class="col-lg-2">
                <select class="form-select" aria-label="Select room type">
                    <option selected>Room Type</option>
                    <option>Solo</option>
                    <option>Shared</option>
                </select>
            </div>

            <div class="col-lg-3 d-grid">
                <button
                    type="button"
                    class="btn btn-primary"
                    aria-label="Search boarding houses">
                    Search
                </button>
            </div>

        </div>

    </div>

</section>
