<section class="py-5">
    <div class="container">
        <div class="card shadow border-0 p-5">

            <h3 class="fw-bold mb-4">
                Request a Booking
            </h3>

            <form>

                <div class="mb-3">
                    <label for="fullName" class="form-label">
                        Full Name
                    </label>
                    <input
                        type="text"
                        id="fullName"
                        name="full_name"
                        class="form-control"
                        placeholder="Enter your full name"
                        required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email Address
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email address"
                        required>
                </div>

                <div class="mb-4">
                    <label for="checkInDate" class="form-label">
                        Preferred Check-in Date
                    </label>
                    <input
                        type="date"
                        id="checkInDate"
                        name="check_in_date"
                        class="form-control"
                        required>
                </div>

                <button
                    type="submit"
                    class="btn btn-primary btn-lg">
                    Send Booking Request
                </button>

            </form>

        </div>
    </div>
</section>
