{% extends 'layouts/base.html' %}

{% block title %}Register{% endblock %}

{% block content %}

<section class="py-5 bg-light">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6">

                <div class="card shadow-lg border-0 rounded-4">

                    <div class="card-body p-5">

                        <div class="text-center mb-4">

                            <h2 class="fw-bold">
                                Create Account
                            </h2>

                            <p class="text-muted">
                                Join BoardingFinder today.
                            </p>

                        </div>

                        <form method="post">

                            {% csrf_token %}

                            <div class="mb-3">

                                <label for="fullName" class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    id="fullName"
                                    name="full_name"
                                    class="form-control"
                                    placeholder="Enter your full name"
                                    autocomplete="name"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label for="email" class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    autocomplete="email"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label for="phone" class="form-label">
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    id="phone"
                                    name="phone"
                                    class="form-control"
                                    placeholder="09XXXXXXXXX"
                                    autocomplete="tel"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label for="accountType" class="form-label">
                                    Account Type
                                </label>

                                <select
                                    id="accountType"
                                    name="account_type"
                                    class="form-select"
                                    required>

                                    <option value="" selected disabled>
                                        Select account type
                                    </option>

                                    <option value="student">
                                        Student
                                    </option>

                                    <option value="owner">
                                        Boarding House Owner
                                    </option>

                                </select>

                            </div>

                            <div class="mb-3">

                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Create a password"
                                    autocomplete="new-password"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label for="confirmPassword" class="form-label">
                                    Confirm Password
                                </label>

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    name="confirm_password"
                                    class="form-control"
                                    placeholder="Confirm your password"
                                    autocomplete="new-password"
                                    required>

                            </div>

                            <div class="form-check mb-4">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="terms"
                                    name="terms"
                                    required>

                                <label
                                    class="form-check-label"
                                    for="terms">

                                    I agree to the
                                    <a href="#">Terms</a>
                                    and
                                    <a href="#">Privacy Policy</a>

                                </label>

                            </div>

                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-primary btn-lg">

                                    Create Account

                                </button>

                            </div>

                        </form>

                        <hr>

                        <p class="text-center mb-0">

                            Already have an account?

                            <a href="{% url 'accounts:login' %}">
                                Login
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
