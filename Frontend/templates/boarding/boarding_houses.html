{% extends 'layouts/base.html' %}

{% block title %}Boarding Houses{% endblock %}

{% block content %}

<section class="py-5 bg-light">

    <div class="container">

        <div class="text-center mb-5">

            <p class="text-primary fw-semibold mb-2">
                BOARDING HOUSES
            </p>

            <h1 class="fw-bold">
                Find Your Boarding House
            </h1>

            <p class="text-muted">
                Browse available boarding houses in your area.
            </p>

        </div>

        <div class="row">

            <div class="col-12">

                <div class="card border-0 shadow-sm rounded-4">

                    <div class="card-body p-5 text-center">

                        <h4 class="fw-bold">
                            No boarding houses available yet.
                        </h4>

                        <p class="text-muted mb-0">
                            Boarding houses will appear here once they are added.
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
